[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefix"
version = "0.1.0"
description = "TraceFix: TLA+-verified coordination protocols for LLM multi-agent systems"
requires-python = ">=3.11"
dependencies = ["jsonschema"]

[project.optional-dependencies]
# Install with: pip install -e ".[test]"
test = [
    "pytest",
    "pytest-asyncio",   # monitoring/tests/test_coord.py uses @pytest.mark.asyncio
    "tree-sitter",       # extract-states + pluscal_parser tests
    "tree-sitter-tlaplus",
]
# Install with: pip install -e ".[opencode]"
# Only the standalone `tracefix-coord` MCP server (coord_mcp/server.py) needs mcp;
# the opencode_adapter orchestrator/driver/config-gen import fine without it.
opencode = [
    "mcp",   # official Model Context Protocol SDK
]

[project.scripts]
tla-verify-pluscal = "tracefix.cli.cli:main"
tracefix-coord = "tracefix.runtime.coord_mcp.server:main"

[tool.setuptools.packages.find]
include = ["tracefix*", "benchmark*"]
